<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="planegrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="60" height="60" x="2" y="2" rx="12" ry="12" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Airplane body (pointing upper-right, rotated 45°) -->
  <g transform="translate(32,32) rotate(-45) translate(-14,-14)">
    <!-- Main fuselage -->
    <path d="M14 4 C14 4 18 8 18 14 L18 20 L24 24 L24 26 L18 24 L18 30 L21 32 L21 34 L14 31 L7 34 L7 32 L10 30 L10 24 L4 26 L4 24 L10 20 L10 14 C10 8 14 4 14 4 Z"
          fill="url(#planegrad)" opacity="0.97"/>
  </g>

  <!-- Small speed lines -->
  <line x1="8" y1="46" x2="18" y2="46" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="51" x2="16" y2="51" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
